# /etc/X11/xorg.conf.d/20-gma3600.conf
#
# Intel GMA 3600 (Cedar Trail) Modern X.Org Server Configuration
# Compatible with X.Org Server 1.20, 21.1+, and future versions
# using the standard KMS modesetting DDX driver.
#

Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "AutoEnableDevices" "true"
    Option "DontZap" "false"
EndSection

Section "Device"
    Identifier     "Intel GMA 3600"
    Driver         "modesetting"
    BusID          "PCI:0:2:0"

    # KMS DRM Device Node
    Option         "kmsdev"            "/dev/dri/card0"

    # Hardware Cursor (64x64 ARGB supported natively by gma3600 driver)
    Option         "SWcursor"          "false"

    # Hardware Page Flipping via DRM/KMS Atomic IOCTLs
    Option         "PageFlip"          "true"

    # 2D Acceleration:
    # "glamor"   - Uses Mesa LLVMpipe/softpipe for accelerated 2D via modern OpenGL
    # "shadowfb" - Uses CPU shadow framebuffer; very lightweight for Atom CPUs
    Option         "AccelMethod"       "glamor"

    # DRI (Direct Rendering Infrastructure) version
    Option         "DRI"               "3"

    # Double buffer / Tear-free synchronization with VBlank
    Option         "AsyncFlipSecondaries" "false"
EndSection

Section "Screen"
    Identifier     "Screen0"
    Device         "Intel GMA 3600"
    Monitor        "Monitor0"
    DefaultDepth   24

    SubSection "Display"
        Depth      24
        Modes      "1920x1080" "1600x900" "1366x768" "1280x720" "1024x768" "1024x600"
    EndSubSection
EndSection

Section "Monitor"
    Identifier     "Monitor0"
    Option         "DPMS" "true"
EndSection
