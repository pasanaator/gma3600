# /etc/X11/xorg.conf.d/20-gma3600-shadowfb.conf
#
# Intel GMA 3600 Low-Power / ShadowFB Configuration
# Recommended for single-core Atom N2600 / D2500 netbooks
# Provides maximum responsiveness without CPU rasterization load.
#

Section "Device"
    Identifier     "Intel GMA 3600 ShadowFB"
    Driver         "modesetting"
    BusID          "PCI:0:2:0"
    Option         "kmsdev"            "/dev/dri/card0"
    Option         "SWcursor"          "false"
    Option         "PageFlip"          "true"
    Option         "ShadowFB"          "true"
    Option         "AccelMethod"       "none"
    Option         "DRI"               "2"
EndSection

Section "Screen"
    Identifier     "Screen0"
    Device         "Intel GMA 3600 ShadowFB"
    DefaultDepth   24
EndSection
